[project]
name = "partnersim-dynet"
version = "0.1.0"
description = "Agent-based dynamic partnership network simulation"
authors = [
    {name = "Priyanka Nair-Turkich", email = "priyanka.nairturkich@student.unimelb.edu.au"},
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
keywords = ["simulation", "network", "agent-based", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy (>=1.26,<3.0)",
    "pandas (>=2.1,<3.0)",
    "numba (>=0.59,<1.0)",
    "pyarrow (>=14.0,<20.0)",
    "networkx (>=3.2,<4.0)",
    "matplotlib (>=3.8,<4.0)",
    "seaborn (>=0.13,<1.0)",
]

[project.urls]
Homepage = "https://github.com/yourusername/partnersim-dynet"
Repository = "https://github.com/yourusername/partnersim-dynet"
Issues = "https://github.com/yourusername/partnersim-dynet/issues"

[tool.poetry]
packages = [{include = "partnersim_dynet", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.6"
mypy = "^1.10"
ipykernel = "^6.29"
pre-commit = "^4.6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "NPY",  # numpy-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args (common with Field/factory)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow `assert` statements in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual typing; tighten later
ignore_missing_imports = true  # numba/networkx have weak stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=partnersim_dynet --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
]
filterwarnings = [
    "ignore:vert.*deprecated:PendingDeprecationWarning:seaborn.*",
]